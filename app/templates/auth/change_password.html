{% extends 'base.html' %}
{% block title %}Change Password - School Education Department{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-punjab text-white text-center py-3">
          <h5 class="mb-0 fw-semibold"><i class="bi bi-shield-lock-fill me-2"></i> Update Password</h5>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('auth.change_password') }}">
            {% if not current_user.is_first_login %}
            <div class="mb-3">
              <label class="form-label fw-semibold text-secondary">Current Password</label>
              <input type="password" name="current_password" class="form-control" placeholder="Enter existing password" required>
            </div>
            {% else %}
            <div class="alert alert-info py-2 small mb-3">
              <i class="bi bi-info-circle me-1"></i> As this is your first sign-in, please set a new personal password.
            </div>
            {% endif %}

            <div class="mb-3">
              <label class="form-label fw-semibold text-secondary">New Password</label>
              <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold text-secondary">Confirm New Password</label>
              <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-punjab py-2 fw-semibold">
                <i class="bi bi-check-circle me-1"></i> Save New Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
